<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAI - Monitor Científico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #8b5cf6; --text: #f1f5f9; --danger: #ef4444; --success: #22c55e; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 12px; background: #334155; }
        .online { background: var(--success); }
        .main-card { background: var(--card); width: 100%; max-width: 500px; border-radius: 20px; padding: 20px; box-sizing: border-box; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .m-box { background: #334155; padding: 15px; border-radius: 15px; text-align: center; }
        .m-val { font-size: 1.8em; font-weight: bold; color: var(--accent); display: block; }
        .m-lab { font-size: 10px; text-transform: uppercase; opacity: 0.6; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .btn-p { background: var(--accent); color: white; }
        .btn-s { background: #475569; color: white; margin-top: 10px; }
        canvas { width: 100% !important; margin-top: 15px; }
        #fase { font-size: 1.2em; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h3><i class="fa-solid fa-heart-pulse"></i> NAI V1.0</h3>
    <span id="st" class="status">Desconectado</span>
</div>

<div class="main-card">
    <button class="btn btn-p" id="cn" onclick="connect()">
        <i class="fa-solid fa-bluetooth"></i> CONECTAR ACTÍGRAFO
    </button>

    <div class="metrics">
        <div class="m-box"><span class="m-lab">Movimiento</span><span id="mv" class="m-val">0.0</span></div>
        <div class="m-box"><span class="m-lab">Audio RMS</span><span id="au" class="m-val">0.0</span></div>
    </div>

    <div style="text-align:center">Fase: <span id="fase">-</span></div>
    <canvas id="ch"></canvas>
</div>

<button class="btn btn-s" onclick="exportData()"><i class="fa-solid fa-download"></i> EXPORTAR CSV</button>

<script>
    let charData, charTime, device;
    let history = [];
    const FASES = ["Reposo", "Inicial", "Plateau", "Pre-Clímax", "Clímax", "Cooldown"];

    // Configuración de Gráfico
    const ctx = document.getElementById('ch').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Mov', borderColor: '#8b5cf6', data: [], borderDash: [2, 2], tension: 0.4, pointRadius: 0 },
            { label: 'Aud', borderColor: '#ec4899', data: [], tension: 0.4, pointRadius: 0 }
        ]},
        options: { scales: { y: { display: false }, x: { ticks: { display: false } } }, plugins: { legend: { display: false } } }
    });

    async function connect() {
        try {
            device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [0x180D, '696e7469-0001-4141-4141-414141414141'] // UUID INTI0001
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(0x180D);

            // 1. Sincronizar Tiempo (Unix Timestamp)
            charTime = await service.getCharacteristic(0x2A3D); // Reemplazar con tu UUID de tiempo
            const now = Math.floor(Date.now() / 1000);
            await charTime.writeValue(new Uint32Array([now]));

            // 2. Notificaciones de Datos
            charData = await service.getCharacteristic(0x2A37);
            charData.startNotifications();
            charData.addEventListener('characteristicvaluechanged', handleData);

            document.getElementById('st').innerText = "Conectado";
            document.getElementById('st').classList.add('online');
            document.getElementById('cn').style.display = "none";
        } catch (e) { alert("Error: " + e); }
    }

    function handleData(event) {
        const v = event.target.value;
        const d = {
            t: v.getUint32(0, true),
            m: v.getFloat32(4, true).toFixed(1),
            a: v.getFloat32(8, true).toFixed(1),
            f: v.getUint8(16)
        };

        // Actualizar UI
        document.getElementById('mv').innerText = d.m;
        document.getElementById('au').innerText = d.a;
        document.getElementById('fase').innerText = FASES[d.f] || "Desconocida";

        // Actualizar Gráfico
        chart.data.labels.push("");
        chart.data.datasets[0].data.push(d.m);
        chart.data.datasets[1].data.push(d.a);
        if(chart.data.labels.length > 30) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); chart.data.datasets[1].data.shift(); }
        chart.update('none');

        history.push(d);
    }

    function exportData() {
        let csv = "Timestamp,Movimiento,Audio,Fase\n";
        history.forEach(r => { csv += `${r.t},${r.m},${r.a},${r.f}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `NAI_Data_${Date.now()}.csv`;
        a.click();
    }
</script>
</body>
</html>
